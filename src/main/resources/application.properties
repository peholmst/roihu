server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

# PostgreSQL, accessed through jOOQ. Started by Docker Compose for local development;
# the application itself runs on the host. See docs/adr/0009.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tabletop}
spring.datasource.username=${DATABASE_USERNAME:tabletop}
spring.datasource.password=${DATABASE_PASSWORD:tabletop}

# Flyway owns the schema. Migrations live in db/migration and are the source the jOOQ
# classes are generated from; see docs/adr/0008.
spring.flyway.enabled=true
