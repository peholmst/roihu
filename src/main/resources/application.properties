server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,net.pkhapps.roihu

# PostgreSQL, accessed through jOOQ. Started by Docker Compose for local development;
# the application itself runs on the host. See docs/adr/0009.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/roihu}
spring.datasource.username=${DATABASE_USERNAME:roihu}
spring.datasource.password=${DATABASE_PASSWORD:roihu}

# Flyway owns the schema. Migrations live in db/migration and are the source the jOOQ
# classes are generated from; see docs/adr/0008.
spring.flyway.enabled=true

# Training officers sign in through an external OpenID Connect provider; Keycloak in development,
# started by Docker Compose. See docs/adr/0005-two-access-paths.md.
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${OIDC_CLIENT_ID:roihu}
spring.security.oauth2.client.registration.keycloak.client-secret=${OIDC_CLIENT_SECRET:dev-only-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/roihu}

# Authenticating proves who someone is; this list decides whose officers they are. The identity
# provider may be shared by several deployments, so each one keeps its own list.
roihu.security.officers=${ROIHU_OFFICERS:anna@example.invalid}
